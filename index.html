  .hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 0 0 12px; }

  /* ---------- bookend pills ---------- */
  .bookend {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 15px; font: inherit; color: var(--ink);

  .bookend .bk-sub { font-size: 12px; color: var(--ink-soft); }

  /* ---------- svg map ---------- */
  .map { width: 100%; height: auto; display: block; overflow: visible; }
  .node { cursor: pointer; }
  .node .disc {
    fill: var(--panel); stroke: var(--nc); stroke-width: 1.5;
    transition: stroke-width .15s, fill .15s;

  .node:hover .disc { stroke-width: 3; }
  .node.is-active .disc { fill: var(--nc); stroke-width: 3; }
  .node .num { fill: var(--nc); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  .node .name { fill: var(--ink); font-size: 13.5px; font-weight: 600; }

  .node:focus { outline: none; }
  .node:focus-visible .disc { stroke: var(--ink); stroke-width: 3; }
  .spoke { stroke: var(--line-strong); stroke-width: 1; }
  .spoke.is-active { stroke: var(--nc); stroke-width: 2; }

<script>
const CHAPTERS = [
  {
    key: "ch1", n: 1, color: "var(--c1)",
    label: "第 1 章", short: "モチベーション",
    title: "モチベーションマネジメント",
    catch: "ワクワクを燃料に、成長ループを回す",
    lead: "モチベーションは「上がるもの」ではなく<strong>「取り扱うもの」</strong>。精神論ではなく、成果の“質”を左右する土台として扱います。",
    when: ["やる気が出ない", "何のために頑張っているか見えない"],
    points: [
      ["量ではなく「質」に効く", "決められた作業をこなすだけならモチベーションはあまり効かない。正解のない問いを解き、学び続け、協働する仕事だからこそ燃料が要る。"],
      ["源泉は人それぞれ、状況でも変わる", "内発（好奇心・成長実感・意味・自律）と外発（報酬・承認・評価）。ERG理論のとおり、置かれた状況でも引っぱられる欲求は動く。"],
      ["サイクルとして設計する", "目的 → 誘引 → 摩擦 → ふりかえり。上がるのを待つのではなく、続く仕組みをつくる。"],
      ["明日からのTips", "欲求を言葉にする／個人OKRに自分のWillを紐づける／小さなWinを設計する。"]
    ],
    tags: ["内発的動機", "外発的動機", "ERG理論", "個人OKR", "小さなWin"]
  },
  {
    key: "ch2", n: 2, color: "var(--c2)",
    label: "第 2 章", short: "タスク・タイム",
    title: "タスク・タイムマネジメント",
    catch: "余白をデザインする技術",
    lead: "タイムマネジメントは時間術ではなく<strong>「余白のデザイン」</strong>。燃料があっても、道が渋滞していれば前に進めません。",
    when: ["時間が奪われている", "一日終わって何もやり遂げていない"],
    points: [
      ["道が渋滞する3つの要因", "予定で埋め尽くされた一日／兼務によるスイッチングコスト／止まらないチャットの割り込み。"],
      ["時間どろぼうは、外からも内からも来る", "外＝あなぼこ小僧・ピコピコ忍者・ツァイガルニク夫。内＝居座りゴブリン・スクロール魔女・チリ積婆。"],
      ["退治法は2系統", "外には環境設計（通知オフの時間・カレンダーのデフラグ・WIP＝1）、内には習慣設計（タイムボクシング・タスクの細分化・やめる勇気）。"],
      ["リソース効率 vs フロー効率", "稼働率100%を追うと変化で一気に詰まる。WIPを絞り余白を残すほうが、長距離では結果として速い。"],
      ["余白が生む3つの価値", "変化への適応／創造性の獲得／燃え尽きの回避。生まれた余白を、また新しいタスクで埋めない。"],
      ["本にある武器", "GTD（5ステップ）／アイゼンハワーマトリクス／移譲（6ステップ）。"]
    ],
    tags: ["余白のデザイン", "WIP", "フロー効率", "カレンダーのデフラグ", "GTD", "アイゼンハワーマトリクス"],

/* ---------- SVG map generation ---------- */
const CX = 260, CY = 250, R = 176, NR = 57;
const spokesEl = document.getElementById("spokes");
const nodesEl  = document.getElementById("nodes");
const NS = "http://www.w3.org/2000/svg";

CHAPTERS.forEach((ch, i) => {
  const a = (-90 + i * 72) * Math.PI / 180;
  const x = CX + R * Math.cos(a), y = CY + R * Math.sin(a);

  const line = document.createElementNS(NS, "line");
  line.setAttribute("class", "spoke");
  line.setAttribute("x1", CX + 76 * Math.cos(a));
  line.setAttribute("y1", CY + 76 * Math.sin(a));
  line.setAttribute("x2", x - NR * Math.cos(a));
  line.setAttribute("y2", y - NR * Math.sin(a));
  line.style.setProperty("--nc", ch.color);
  line.dataset.key = ch.key;
  spokesEl.appendChild(line);

  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "node");
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  g.setAttribute("aria-label", ch.label + " " + ch.title);
  g.style.setProperty("--nc", ch.color);
  g.dataset.key = ch.key;

  const c = document.createElementNS(NS, "circle");
  c.setAttribute("class", "disc");
  c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", NR);
  g.appendChild(c);

  const t1 = document.createElementNS(NS, "text");
  t1.setAttribute("class", "num"); t1.setAttribute("x", x); t1.setAttribute("y", y - 16);
  t1.textContent = "CH." + ch.n;
  g.appendChild(t1);

  ch.short.split("・").forEach((part, k, arr) => {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "name");
    t.setAttribute("x", x);
    t.setAttribute("y", y + 6 + k * 17 - (arr.length - 1) * 8);
    t.textContent = arr.length > 1 && k < arr.length - 1 ? part + "・" : part;
    g.appendChild(t);
  });

  nodesEl.appendChild(g);
});

/* ---------- rendering ---------- */
const ALL = {};
CHAPTERS.forEach(c => ALL[c.key] = c);
Object.assign(ALL, EXTRAS);

const detail = document.getElementById("detail");

function render(key) {
  const d = ALL[key];
  detail.style.setProperty("--dc", d.color);
  detail.innerHTML = `
    <p class="d-label">${d.label}</p>
    <h2 class="d-title">${d.title}</h2>
    <p class="d-catch">${d.catch}</p>
    <p class="d-lead">${d.lead}</p>

    <p class="d-h">こんなときに開く</p>
    <ul class="chips">${d.when.map(w => `<li>${w}</li>`).join("")}</ul>

    <p class="d-h">この章で扱うこと</p>
    <ul class="points">${d.points.map(([h, b]) => `<li><b>${h}</b><span>${b}</span></li>`).join("")}</ul>

    ${d.quote ? `<p class="quote">${d.quote}</p>` : ""}

    <p class="d-h">キーワード</p>
    <ul class="tags">${d.tags.map(t => `<li>${t}</li>`).join("")}</ul>
  `;

  document.querySelectorAll(".node").forEach(n =>
    n.classList.toggle("is-active", n.dataset.key === key));
  document.querySelectorAll(".spoke").forEach(s =>
    s.classList.toggle("is-active", s.dataset.key === key));
  document.querySelectorAll(".bookend").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.key === key)));
}

document.querySelectorAll(".node, .bookend").forEach(el => {
  el.addEventListener("click", () => render(el.dataset.key));
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); render(el.dataset.key); }
  });
});

render("intro");
